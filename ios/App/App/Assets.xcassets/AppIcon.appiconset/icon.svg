<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5EE6A8"/>
      <stop offset="50%" style="stop-color:#3DD091"/>
      <stop offset="100%" style="stop-color:#2BB880"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- Shine overlay -->
  <ellipse cx="400" cy="300" rx="400" ry="350" fill="url(#shine)"/>

  <!-- Pet body -->
  <ellipse cx="512" cy="580" rx="280" ry="250" fill="#ffffff"/>

  <!-- Pet face -->
  <circle cx="380" cy="480" r="45" fill="#333"/>
  <circle cx="380" cy="470" r="15" fill="#fff"/>
  <circle cx="644" cy="480" r="45" fill="#333"/>
  <circle cx="644" cy="470" r="15" fill="#fff"/>

  <!-- Nose -->
  <ellipse cx="512" cy="560" rx="30" ry="20" fill="#FFB6C1"/>

  <!-- Mouth -->
  <path d="M 470 590 Q 512 640 554 590" stroke="#333" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="280" cy="380" rx="60" ry="80" fill="#ffffff" transform="rotate(-30 280 380)"/>
  <ellipse cx="744" cy="380" rx="60" ry="80" fill="#ffffff" transform="rotate(30 744 380)"/>

  <!-- Cheeks -->
  <ellipse cx="320" cy="550" rx="40" ry="30" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="704" cy="550" rx="40" ry="30" fill="#FFB6C1" opacity="0.6"/>

  <!-- Star badge -->
  <polygon points="512,180 540,240 610,250 560,300 575,370 512,335 449,370 464,300 414,250 484,240"
           fill="#FFD700" stroke="#FFA500" stroke-width="4"/>

  <!-- Text -->
  <text x="512" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="80"
        font-weight="bold" fill="#333" text-anchor="middle">Class Pets</text>
</svg>